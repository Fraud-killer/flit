[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# pytest-django is installed as a dev dependency but this suite sets Django up
# itself in tests/conftest.py; left enabled, the plugin imports kernel.settings
# before conftest has put app/ on sys.path and the run dies in collection.
addopts = -v --tb=short -p no:django
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
