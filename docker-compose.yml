services:
  db:
    image: postgres:alpine3.19
    environment:
      POSTGRES_DB: app-db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./tmp/db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./tmp/redis:/data
    ports:
      - 16379:6379

  app:
    build:
      target: local
      dockerfile: Dockerfile.app
    command: >
      wait4x tcp db:5432 --timeout 120s
      --
      wait4x tcp redis:6379 --timeout 30s
      --
      python manage.py runserver 0.0.0.0:8000
    ports:
      - 18000:8000
    volumes:
      - ./app:/app
      - ./tmp/dev:/tmp/dev
    environment:
      DEBUG: true
      DATABASE_URL: postgres://postgres@db:5432/app-db
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
      FINGERPRINT_SERVER_API_KEY: eJX9OrOWbZd9bVeHcVUg
      FINGERPRINT_MANAGEMENT_API_KEY: 0dtjWWgEGQzHOiEr3C32
      MCRYPT_KEY: kTMwZPVNixtc_nI4sqJcV4sybRlQZFb6P7LWE_ZNR6g=
      SECRET_KEY: local!@pj#0nr%=a4znu#_6%7s89(43h+iv5#2@1%1-!e@6w)2
    depends_on:
      - db
      - redis
