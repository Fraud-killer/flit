services:
  db:
    image: postgres:alpine3.19
    environment:
      POSTGRES_DB: app-db
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./tmp/db:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - ./tmp/redis:/data
    ports:
      - 16379:6379

  app:
    build:
      target: local
      dockerfile: Dockerfile.app
    command: >
      wait4x tcp db:5432 --timeout 120s
      --
      wait4x tcp redis:6379 --timeout 30s
      --
      python manage.py runserver 0.0.0.0:8000
    ports:
      - 18000:8000
    volumes:
      - ./app:/app
      - ./tmp/dev:/tmp/dev
    # Secrets (SECRET_KEY, MCRYPT_KEY, FINGERPRINT_*) come from .env.
    # Copy .env.example to .env and fill it in; never commit real values.
    env_file: .env
    environment:
      DEBUG: true
      DATABASE_URL: postgres://postgres@db:5432/app-db
      REDIS_URL: redis://redis:6379/0
      CACHE_URL: redis://redis:6379/1
    depends_on:
      - db
      - redis
